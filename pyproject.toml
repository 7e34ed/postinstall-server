[project]
name = "postinstall-server"
version = "0.1.0"
description = "postinstall-server: source of truth for psi-agent"
requires-python = ">=3.12"
dependencies = [
    "django>=5.1,<5.2",
    "django-configurations>=2.5.1",
    "psycopg[binary]>=3.2",
    "redis>=5.0",
    "celery[redis]>=5.3",
    "djangorestframework>=3.15",
    "drf-spectacular>=0.27",
    "django-filter>=24.1",
    "django-tables2>=2.7",
    "django-guardian>=2.4",
    "django-constance[redis]>=3.1",
    "django-unfold>=0.40",
    "django-vite>=3.0",
    "django-simple-history>=3.5",
    "django-taggit>=5.0",
    "django-storages[s3]>=1.14",
    "boto3>=1.34",
    "loguru>=0.7,<1",
    "gunicorn>=21.2",
    "whitenoise>=6.6",
    "pykeepass>=4.0,<5",
    "filelock>=3.13,<4",
    "django-allauth>=65.0,<66",
    "django-allauth-ui>=1.8,<2",
    "django-widget-tweaks>=1.5,<2",
    "slippers>=0.6,<1",
    "qrcode[pil]>=8.0",
    "pyotp>=2.9",
    "pyrad>=2.4,<3",        # radius backend библиотека для работы с Aladdin
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5",
    "pytest>=8.0",
    "pytest-django>=4.8",
    "factory-boy>=3.3",
    "django-debug-toolbar>=4.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["config", "apps"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]
ignore = ["E501", "DJ001"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
DJANGO_CONFIGURATION = "Testing"
testpaths = ["tests"]