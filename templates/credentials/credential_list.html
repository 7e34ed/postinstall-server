{% extends "base.html" %}
{% load django_tables2 %}

{% block title %}Учетные записи{% endblock %}

{% block content %}
<div class="card bg-base-200 shadow">
  <div class="card-body">
    <div class="flex items-center justify-between mb-4">
      <h1 class="card-title">Учетные записи админа</h1>
      <a class="btn btn-sm btn-primary" href="{% url 'config:profile-create' %}">
        + Создать учетку
      </a>
    </div>

    <form method="get"
          hx-get="{% url 'config:profile-list' %}"
          hx-target="#profile-table"
          hx-trigger="change, submit"
          hx-push-url="true"
          class="grid grid-cols-1 md:grid-cols-3 gap-3 mb-4">
      {{ filter.form.as_div }}
      <div class="col-span-full flex gap-2">
        <button class="btn btn-primary btn-sm" type="submit">Фильтр</button>
        <a class="btn btn-ghost btn-sm" href="{% url 'config:profile-list' %}">Сбросить</a>
      </div>
    </form>

    <div id="profile-table" class="overflow-x-auto">
      {% render_table table %}
    </div>
  </div>
</div>
{% endblock %}
