{% extends "base.html" %}

{% block title %}Новый сервисный аккаунт{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto">
  <div class="card bg-base-200 shadow">
    <div class="card-body">
      <h1 class="card-title">Новый сервисный аккаунт</h1>

      {% if messages %}
        {% for m in messages %}
          <div class="alert alert-{% if m.tags == 'error' %}error{% else %}info{% endif %} text-sm">
            {{ m }}
          </div>
        {% endfor %}
      {% endif %}

      <form method="post" class="space-y-3 mt-4">
        {% csrf_token %}

        <div>
          <label class="label"><span class="label-text">Имя (a-z, 0-9, -, _)</span></label>
          <input type="text" name="name" required
                 pattern="[a-z0-9_\-]+" maxlength="64"
                 class="input input-bordered w-full font-mono">
        </div>

        <div>
          <label class="label"><span class="label-text">Описание</span></label>
          <textarea name="description" rows="2"
                    class="textarea textarea-bordered w-full"></textarea>
        </div>

        <div>
          <label class="label"><span class="label-text">Scope</span></label>
          <select name="scope" required class="select select-bordered w-full">
            {% for value, label in scopes %}
              <option value="{{ value }}">{{ label }}</option>
            {% endfor %}
          </select>
        </div>

        <div>
          <label class="label"><span class="label-text">Домен (для не-READ_ALL)</span></label>
          <select name="domain" class="select select-bordered w-full">
            <option value="">—</option>
            {% for d in domains %}
              <option value="{{ d.pk }}">{{ d.name }}</option>
            {% endfor %}
          </select>
        </div>

        <div>
          <label class="label"><span class="label-text">Срок действия токена (дней)</span></label>
          <input type="number" name="ttl_days" value="365" min="1" max="3650"
                 class="input input-bordered w-full">
        </div>

        <button type="submit" class="btn btn-primary">Создать</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
