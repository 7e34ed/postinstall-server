services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: postinstall
      POSTGRES_USER: postinstall
      POSTGRES_PASSWORD: postinstall
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postinstall"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s

  django:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DATABASE_URL: postgres://postinstall:postinstall@postgres:5432/postinstall
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

  target-linux-1: &target
    image: debian:12-slim
    command: ["sleep", "infinity"]
    hostname: web1.local
    environment:
      DEBIAN_FRONTEND: noninteractive
    volumes:
      - ./_ci/target-keys:/root/.ssh:ro

  target-linux-2:
    <<: *target
    hostname: web2.local

volumes: {}