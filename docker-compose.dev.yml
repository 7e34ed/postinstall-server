services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: postinstall
      POSTGRES_USER: postinstall
      POSTGRES_PASSWORD: postinstall
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postinstall"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  # S3 storage
  versitygw:
    image: versity/versitygw:latest
    command: ["posix", "--port", ":8333", "/data"]
    environment:
      ROOT_ACCESS_KEY: psiaccess
      ROOT_SECRET_KEY: psisecret
    volumes:
      - versity-data:/data
    ports:
      - "127.0.0.1:8333:8333"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8333/ || exit 1"]
      interval: 5s
      retries: 10

  django:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    command: uv run python manage.py runserver 0.0.0.0:8000
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
      DJANGO_CONFIGURATION: Development
      DATABASE_URL: postgres://postinstall:postinstall@postgres:5432/postinstall
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      SECRETS_MASTER_KEY_FILE: /run/secrets/master.key
      SECRETS_ALLOW_INTERACTIVE: "false"
      SECRETS_ALLOW_INSECURE_UNSEAL: "true"    # dev only
      SECRETS_TRUSTED_PROXIES: ""
      PSI_LOG_DIR: /app/logs
    env_file:
      - .env
    volumes:
      - .:/app
      - uv-cache:/root/.cache/uv
      - ./.secrets:/run/secrets:ro
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres: {condition: service_healthy}
      redis:    {condition: service_healthy}
      openbao:  {condition: service_healthy}

  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    command: uv run celery -A config worker -l info
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
      DJANGO_CONFIGURATION: Development
      DJANGO_SECRET_KEY: dev-not-secret
      DATABASE_URL: postgres://postinstall:postinstall@postgres:5432/postinstall
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      SECRETS_MASTER_KEY_FILE: /run/secrets/master.key
      SECRETS_ALLOW_INTERACTIVE: "false"
      SECRETS_ALLOW_INSECURE_UNSEAL: "true"    # dev only
      SECRETS_TRUSTED_PROXIES: ""
      PSI_LOG_DIR: /app/logs
    env_file:
      - .env
    volumes:
      - .:/app
      - uv-cache:/root/.cache/uv
      - ./.secrets:/run/secrets:ro
    depends_on:
      django:
        condition: service_healthy
      openbao:
          condition: service_healthy

  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    command: uv run celery -A config beat -l info
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
      DJANGO_CONFIGURATION: Development
      DJANGO_SECRET_KEY: dev-not-secret
      DATABASE_URL: postgres://postinstall:postinstall@postgres:5432/postinstall
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      SECRETS_MASTER_KEY_FILE: /run/secrets/master.key
      SECRETS_ALLOW_INTERACTIVE: "false"
      SECRETS_ALLOW_INSECURE_UNSEAL: "true"    # dev only
      SECRETS_TRUSTED_PROXIES: ""
      PSI_LOG_DIR: /app/logs
    env_file:
      - .env
    volumes:
      - .:/app
      - uv-cache:/root/.cache/uv
      - ./.secrets:/run/secrets:ro
    depends_on:
      django:
        condition: service_healthy
      openbao:
        condition: service_healthy

  openbao:
    image: openbao/openbao:latest
    command: ["server", "-dev", "-dev-root-token-id=root-token-dev"]
    environment:
      BAO_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    ports:
      - "127.0.0.1:8200:8200"
    cap_add:
      - IPC_LOCK
    healthcheck:
      test: ["CMD", "bao", "status"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
  versity-data:
  uv-cache: